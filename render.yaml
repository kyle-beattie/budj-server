# The database and auth server live in Supabase, so Render runs the API only —
# there is no Render Postgres instance and no pre-deploy migration step.
# Migrations are applied with `pnpm db:push` against the linked Supabase project.

services:
  - type: web
    name: budj-server
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

      # Must match the service's public URL, or auth redirect links point at
      # the wrong host.
      - key: PUBLIC_URL
        value: https://budj-server.onrender.com

      # Supabase project settings -> Data API.
      - key: SUPABASE_URL
        sync: false
      # Publishable ("anon") key. Subject to RLS.
      - key: SUPABASE_ANON_KEY
        sync: false
      # Secret ("service_role") key. Bypasses RLS — keep it out of the blueprint
      # and set it in the dashboard.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Where Supabase sends users after email confirmation / password reset.
      # Must also be listed under Supabase Auth -> URL Configuration.
      - key: AUTH_REDIRECT_URL
        sync: false

      # Comma-separated browser origins allowed to call this API.
      - key: CORS_ORIGINS
        sync: false
