databases:
  - name: budj-db
    databaseName: budj
    user: budj
    plan: basic-256mb
    postgresMajorVersion: "17"

services:
  - type: web
    name: budj-server
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    # Runs after the build, before traffic is switched over.
    preDeployCommand: pnpm db:migrate:prod
    startCommand: pnpm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: budj-db
          property: connectionString
      # Internal connections inside Render's network don't use TLS.
      - key: DATABASE_SSL
        value: "false"
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Must match the service's public URL, or auth callbacks will be rejected.
      - key: BETTER_AUTH_URL
        value: https://budj-server.onrender.com
      # Comma-separated browser origins allowed to call this API with cookies.
      - key: CORS_ORIGINS
        sync: false
